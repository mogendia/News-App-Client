<div class="container" style="direction: rtl; padding: 20px;">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6">
      <div class="border rounded p-4 shadow-sm bg-white">
        <h2 class="text-center mb-4 text-danger">إنشاء حساب سوبر مشرف</h2>

        <form [formGroup]="registerForm" (ngSubmit)="register()">
          <div class="mb-3">
            <label for="email" class="form-label">البريد الإلكتروني</label>
            <input id="email" formControlName="email" class="form-control" placeholder="أدخل البريد الإلكتروني">
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">كلمة المرور</label>
            <input id="password" type="password" formControlName="password" class="form-control" placeholder="أدخل كلمة المرور">
          </div>

          <button type="submit" class="btn btn-danger btn-lg w-100" [disabled]="registerForm.invalid">
            إنشاء
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
