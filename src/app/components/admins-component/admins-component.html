<div class="container mt-4 mb-5">
  <div class="row">
    <!-- إعلان الشريط الجانبي (على الشمال) -->
    <div class="col-12 col-md-3 order-1  mt-4  order-md-1 mt-md-0">
      <app-ad-sidebar></app-ad-sidebar>
    </div>

    <!-- قائمة المشرفين (على اليمين) -->
    <div class="col-12 col-md-9 order-2 order-md-0">
      <div class="admins-list">
        <h3 class="mb-3">قائمة المشرفين</h3>

        <div *ngIf="admins.length === 0" class="alert alert-info">لا توجد مشرفين</div>

        <div *ngIf="admins.length > 0" class="table-responsive">
          <table class="table table-striped table-bordered">
            <thead class="table-dark">
              <tr>
                <th>البريد الإلكتروني</th>
                <th>الإجراءات</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let admin of admins">
                <td>{{ admin.email }}</td>
                <td>
                  <button class="btn btn-sm btn-warning ms-2" (click)="editAdmin(admin)">تعديل</button>
                  <button class="btn btn-sm btn-danger" (click)="deleteAdmin(admin.id)">حذف</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
