<nav class="navbar navbar-expand-lg navbar-light bg-danger">
  <div class="container-fluid">

    <!-- 🔰 Logo + Title -->
    <a class="navbar-brand d-flex align-items-center" routerLink="/">
      <img src="./favicon.ico" alt="Logo" width="40" height="40" class="me-2" />
      <div>
        <div class="text-white fw-bold fs-5 me-4">البوصلــــــة</div>
        <small class="text-white me-4">الــبــوصــلــة.. الحقـيـقـة لها اتـجـاه</small>
      </div>
    </a>

    <!-- ☰ Toggler Button -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarContent"
      aria-controls="navbarContent"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- 🔗 Main Navbar Content -->
    <div class="collapse navbar-collapse" id="navbarContent">

      <!-- 📌 الأقسام Dropdown -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item dropdown" *ngIf="sectionList.length > 0">
          <a
            class="nav-link dropdown-toggle text-white"
            href="#"
            id="sectionsDropdown"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            الأقــســام
          </a>
          <ul class="dropdown-menu" aria-labelledby="sectionsDropdown">
            <ng-container *ngFor="let section of sectionList">
              <li class="dropdown-item d-flex justify-content-between align-items-center">
                <a
                  [routerLink]="['/sections', section.id]"
                  class="text-dark text-decoration-none flex-grow-1"
                  [ngClass]="authService.getIsSuperAdmin() ? 'text-start' : 'text-center'"
                >
                  {{ section.name }}
                </a>
                <ng-container *ngIf="authService.getIsSuperAdmin()">
                  <button class="btn btn-sm btn-outline-primary me-1" (click)="editSection(section.id)">✏️</button>
                  <button class="btn btn-sm btn-outline-danger" (click)="deleteSection(section.id)">❌</button>
                </ng-container>
              </li>
            </ng-container>
            <li><hr class="dropdown-divider" /></li>
            <li *ngIf="authService.getIsSuperAdmin()">
              <button class="btn btn-sm btn-danger text-center w-100" (click)="goToAddSection()">➕ إضافة قسم جديد</button>
            </li>
          </ul>
        </li>

        <!-- 🔧 Super Admin Menu -->
        <li class="nav-item dropdown me-3" *ngIf="authService.getIsSuperAdmin()">
          <a
            class="nav-link dropdown-toggle text-white"
            href="#"
            id="superAdminDropdown"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            سوبر مشرف
          </a>
          <ul class="dropdown-menu" aria-labelledby="superAdminDropdown">
            <li>

              <button class="btn btn-sm btn-outline-danger mb-2 w-75 px-4 mx-auto d-block" [routerLink]="['/pending-news']">
              خبر معلق
              </button>
            </li>
            <li>
              <button class="btn btn-sm btn-outline-danger mb-2 w-75 px-4 mx-auto d-block" [routerLink]="['/admins']">
                 المشرفين
              </button>
            </li>
          </ul>
        </li>
      </ul>

      <!-- 🔍 Centered Search Form -->
    <form class="d-flex mx-auto my-2 my-lg-0 w-100 w-md-50 ms-5" (ngSubmit)="searchNews()">
  <input
    type="text"
    class="form-control ms-2"
    placeholder="ابحث عن خبر"
    [(ngModel)]="searchTerm"
    name="searchTerm"
  />
  <button class="btn btn-outline-light" type="submit">
    <i class="material-icons">search</i>
  </button>
</form>

      <!-- 🔐 Auth Menu -->
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item dropdown">
          <a
            class="nav-link dropdown-toggle text-white"
            href="#"
            id="authDropdown"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            {{ authService.isAuthenticated() ? 'تسجيل الخروج' : 'تسجيل الدخول' }}
          </a>
          <ul class="dropdown-menu text-center" aria-labelledby="authDropdown">
            <li *ngIf="!authService.getIsSuperAdmin()">
              <button class="btn btn-sm btn-outline-danger mb-2 w-75 mx-auto d-block" [routerLink]="['/login']">تسجيل الدخول</button>
            </li>
            <li *ngIf="authService.getIsSuperAdmin()">
              <button class="btn btn-sm btn-danger mb-2 w-75 mx-auto d-block" (click)="authService.logout()">تسجيل الخروج</button>
              <a class="btn btn-sm btn-outline-danger mb-2 w-75 mx-auto d-block" [routerLink]="['/register-admin']">حساب مشرف</a>
              <a class="btn btn-sm btn-outline-danger w-75 mx-auto d-block" [routerLink]="['/register-superadmin']">سوبر مشرف</a>
            </li>
          </ul>
        </li>
      </ul>

    </div>
  </div>
</nav>
