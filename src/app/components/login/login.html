<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="col-12 col-sm-8 col-md-6 col-lg-4">
    <div class="login-container border rounded p-4 shadow-sm bg-white">
      <h2 class="text-center mb-4 text-danger">تسجيل الدخول</h2>

      <form (ngSubmit)="login()">
        <div class="mb-3">
          <label for="email" class="form-label">البريد الإلكتروني</label>
          <input type="email" id="email" name="email" [(ngModel)]="email" required class="form-control">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">كلمة المرور</label>
          <input type="password" id="password" name="password" [(ngModel)]="password" required class="form-control">
        </div>

        <button type="submit" class="btn btn-danger btn-lg w-100">تسجيل الدخول</button>
      </form>
    </div>
  </div>
</div>
